# Anchor warm-start style planner for closed-loop Boston evaluation.
#
# The model architecture is identical to style_planner.  It can load a legacy
# diff_planner checkpoint when the corresponding args.json is supplied.

anchor_warm_start_style_planner:
  _target_: baseline.simulation.planner.AnchorWarmStartStylePlanner
  _convert_: "all"

  config:
    _target_: baseline.utils.config.Config
    _convert_: "all"

    args_file: ???
    render_save_dir: ???
    raw_data_save_dir: ""

    guidance_fn: null
    # The first experiment isolates anchor warm-start from style conditioning.
    runtime_preference_enabled: false
    runtime_trace_export_enabled: true

    warm_start_t: 0.30
    warm_start_diffusion_steps: 10
    # Use common random numbers so maneuver differences come from anchors.
    warm_start_shared_noise: true

    # Lane-graph anchor generation.
    anchor_query_radius_m: 12.0
    anchor_max_path_length_m: 160.0
    anchor_max_heading_error_deg: 60.0
    anchor_lane_change_start_s: 0.5
    anchor_lane_change_duration_s: 3.5
    anchor_min_lane_change_speed_mps: 1.0
    anchor_min_reference_speed_mps: 2.0
    anchor_max_reference_speed_mps: 18.0
    anchor_speed_relaxation_s: 1.5
    anchor_fallback_deceleration_mps2: 3.5
    anchor_drivable_check_stride: 5
    anchor_max_offroad_fraction: 0.05

    # Hard validation is deliberately generous on dynamics for the first
    # checkpoint compatibility run; collision and drivable-area checks remain
    # strict. Tighten these after inspecting Boston output distributions.
    selector_max_speed_mps: 35.0
    selector_max_abs_accel_mps2: 12.0
    selector_max_abs_jerk_mps3: 45.0
    selector_max_curvature_1pm: 0.55
    selector_max_offroad_fraction: 0.08
    selector_max_wrong_way_fraction: 0.10
    selector_collision_margin_m: 0.25
    selector_hard_min_clearance_m: 0.0
    selector_drivable_check_stride: 4
    selector_anchor_deviation_weight: 0.35
    selector_clearance_weight: 3.0
    selector_comfort_weight: 0.15
    selector_progress_weight: 0.05

  ckpt_path: ???

  past_trajectory_sampling:
    _target_: nuplan.planning.simulation.trajectory.trajectory_sampling.TrajectorySampling
    _convert_: "all"
    num_poses: 21
    time_horizon: 2

  future_trajectory_sampling:
    _target_: nuplan.planning.simulation.trajectory.trajectory_sampling.TrajectorySampling
    _convert_: "all"
    num_poses: 80
    time_horizon: 8

  device: cuda
