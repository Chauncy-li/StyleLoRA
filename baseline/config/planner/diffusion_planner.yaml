# baseline/config/planner/diffusion_planner.yaml
#
# 闭环仿真时加载的基础 Diffusion Planner 配置模板。
# 运行时通常通过命令行覆盖：
# - `args_file`：训练保存的参数文件；
# - `ckpt_path`：模型权重；
# - `render_save_dir`：可选视频输出目录。

diffusion_planner:
  _target_: baseline.simulation.planner.DiffusionPlanner
  _convert_: "all"

  config:
    _target_: baseline.utils.config.Config
    _convert_: "all"

    args_file: ???
    render_save_dir: ???
    # 为空字符串时默认保存到: <render_save_dir>/raw_step_data
    raw_data_save_dir: ""

    guidance_fn: null
  ckpt_path: ???

  past_trajectory_sampling:
    _target_: nuplan.planning.simulation.trajectory.trajectory_sampling.TrajectorySampling
    _convert_: "all"

    num_poses: 21
    time_horizon: 2

  future_trajectory_sampling:
    _target_: nuplan.planning.simulation.trajectory.trajectory_sampling.TrajectorySampling
    _convert_: "all"

    num_poses: 80
    time_horizon: 8

  device: cuda
