# All filesystem paths are explicit so this is safe to copy to remote servers.
model:
  rank: 4
  alpha: 4
  dropout: 0.0
  target_modules: mlp_output
training:
  steps: 20000
  batch_size: 16
  learning_rate: 0.0001
  neighbor_weight: 1.0
  lora_reg_weight: 0.0
  # 纯 MSE 基线默认关闭方案 B；传入训练集原型文件并使用专项配置后才启用。
  prototype_weight: 0.0
  prototype_margin_weight: 0.0
  prototype_margin: 0.20
  grad_clip_norm: 5.0
data:
  num_workers: 4
  min_label_confidence: 0.0
evaluation:
  rho: [-1.0, -0.75, -0.5, -0.25, 0.0, 0.25, 0.5, 0.75, 1.0]
